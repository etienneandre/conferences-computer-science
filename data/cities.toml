# at build time, and storing it would be invisible in an editor and easy to
# break on a copy-paste. `subdivision` is only needed where a country has
# its own recognised flags — England, Scotland and Wales all sit under GB.
#
# Coordinates are city-centre points, to four decimals. That is what a map
# marker needs; more digits would be false precision.


