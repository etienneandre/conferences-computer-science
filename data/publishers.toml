# Publishers.
#
# One entry per collection; delivery platforms (IEEE Xplore, the ACM
# Digital Library, ScienceDirect) fold into their publisher. `aliases` is
# no longer how the data is read — the data now carries these names — but
# a net for anything contributed later, matched on letters and digits
# alone, so punctuation and case variants need no line of their own.
#
# A journal is here when its issue *is* the proceedings, which is a
# publishing arrangement and not a special issue after the fact: PACMPL,
# PACMSE, ACM SIGBED Review, IEEE TCAD. Extended versions published later
# belong in `[[special_issue]]` on the edition instead.
#
# `for_profit` is a claim about the publisher and has three states: true,
# false, and absent for "nobody has written it down". Absent is honest;
# false is an answer. Six entries below are still waiting for one.
#
# Ordered by how many volumes each carries.

["Springer LNCS"]
default_license = "pay-profit"
for_profit = true
# 418 volumes

["IEEE"]
default_license = "pay"
for_profit = false
aliases = ["IEEE (?)", "IEEE ?", "IEEE Xplore", "IEEE Xplore Digital Library", "IEEE eXplore", "IEEE-Xplore"]
# 145 volumes

["ACM"]
default_license = "acm"
# merged from spellings that disagreed: acm x2, free-copy x1
for_profit = false
aliases = ["ACM Digital Library", "ACM Digital Library + conference Web site", "ACM digital library"]
# 128 volumes

