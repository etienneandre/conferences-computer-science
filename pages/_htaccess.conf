# pages/_htaccess.conf — your Apache directives, appended to the generated
# .htaccess. The build reads this and never writes to it.

# The previous version of the site lives on under /old/, so links that were
# published for years keep working. 301 rather than 302: these moves are final,
# and a permanent redirect is what transfers a page's standing in search
# results to its new address.
Redirect permanent /journals.php /old/journals.php
Redirect permanent /global/ /old/global/

# Nothing below /old/ should be indexed: it is kept for continuity, not for
# discovery, and letting it compete with the new pages would be a mistake.
<IfModule mod_headers.c>
    <FilesMatch "^/old/">
        Header set X-Robots-Tag "noindex, nofollow"
    </FilesMatch>
</IfModule>
